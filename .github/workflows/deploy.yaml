name: ci

on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:        # manual trigger for tests

permissions:
  contents: read

jobs:
  # test lint for helm charts and semgrep 
  Test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # version 7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # version 5.1.0

      - name: Lint chart (default values)
        run: helm lint helm/sample-node --strict

      - name: Lint chart (CI values)
        run: helm lint helm/sample-node --strict -f helm/sample-node/ci/test-values.yaml

      - name: Install Semgrep
        run: pipx install semgrep

      - name: Semgrep scan
        run: semgrep scan --config p/javascript --config p/nodejs --config p/owasp-top-ten --error .

  # image build, test and publish to dockerhub
  Image:
    runs-on: ubuntu-latest
    needs: Test
    env:
      IMAGE_NAME: einatsh/sample-node

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # version 7.0.1
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # version 4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # version 7.4.0
        with:
          context: .
          pull: true
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # version 0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Setup Minikube
        uses: medyagh/setup-minikube@e9e035a86bbc3caea26a450bd4dbf9d0c453682e # v0.0.21
        id: minikube
        with:
          driver: docker
          container-runtime: docker
      
      - name: Load image into minikube
        run: minikube image load ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # version 5.1.0

      - name: Install chart
        run: |
          helm install test-app helm/sample-node \
            --set image.repository=${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Never \
            --wait --timeout 120s
      
      - name: Run helm test
        run: helm test test-app --timeout 60s --logs

      - name: Debug on failure
        if: ${{ failure() && steps.minikube.conclusion == 'success' }} # make sure this step only runs after minikube started and in case of failure
        run: |
          kubectl get pods -A
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/instance=test-app --tail=100

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # version 4.8.0
        with:
          username: einatsh
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # update tag for argoCD dev
  Gitops-Update:
    runs-on: ubuntu-latest
    needs: Image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: Gitops-Update # make sure only one job for updating the gitops repo is being run
      cancel-in-progress: false # let a running push finish - the next run waits its turn

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # version 7.0.1
        with:
          repository: einatsh/sample-nodejs-gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Set image tag
        run: yq -i '.image.tag = "${{ github.sha }}"' apps/app/dev/values.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/sample-nodejs/dev/values.yaml
          if git diff --cached --quiet; then
            echo "Tag unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "app: deploy ${GITHUB_SHA::7} to dev"
          git pull --rebase origin main
          git push origin HEAD:main    

